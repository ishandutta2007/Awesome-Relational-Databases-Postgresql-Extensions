<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="45%" stop-color="#0d1b2e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowPostgres" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#336791" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#336791" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Neon Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: url(#titleGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .pill { rx: 16px; ry: 16px; stroke-width: 1.2; stroke-dasharray: 6 3; }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes orbitFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); transform-origin: 1040px 170px; }
      100% { transform: rotate(360deg); transform-origin: 1040px 170px; }
    }

    .pulsing-orb { animation: pulseGlow 7s ease-in-out infinite alternate; }
    .floating-cards { animation: orbitFloat 5s ease-in-out infinite; }
    .streaming-line { stroke-dasharray: 8 12; animation: dataStream 4s linear infinite; }
    .rotating-radar { animation: rotateRing 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect class="bg" width="1200" height="360" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="110" r="260" fill="url(#glowPostgres)" class="pulsing-orb" />
  <circle cx="980" cy="220" r="240" fill="url(#glowCyan)" class="pulsing-orb" style="animation-delay: -3.5s;" />

  <!-- Background Animated Network & Circuit Lines -->
  <g opacity="0.25">
    <path d="M 50 180 Q 250 80, 500 180 T 950 180 T 1150 180" fill="none" stroke="#336791" stroke-width="2" class="streaming-line" />
    <path d="M 100 240 Q 350 320, 650 240 T 1100 240" fill="none" stroke="#00f2fe" stroke-width="1.5" class="streaming-line" style="animation-duration: 6s;" />
    <path d="M 800 60 L 950 140 L 1120 100" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="950" cy="140" r="4" fill="#38bdf8" />
    <circle cx="1120" cy="100" r="3" fill="#00f2fe" />
    <circle cx="800" cy="60" r="3" fill="#336791" />
  </g>

  <!-- Decorative Orbit Ring on Right Side (Dynamic radar) -->
  <g class="rotating-radar" opacity="0.2">
    <circle cx="1040" cy="170" r="100" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 8" />
    <circle cx="1040" cy="170" r="60" fill="none" stroke="#336791" stroke-width="1" />
    <line x1="1040" y1="70" x2="1040" y2="270" stroke="#38bdf8" stroke-width="1" />
    <line x1="940" y1="170" x2="1140" y2="170" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Foreground Main Branding & Header Elements -->
  <!-- Top Category Pill -->
  <g transform="translate(60, 48)">
    <rect width="280" height="28" rx="14" fill="#336791" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#00f2fe" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED DATABASE ECOSYSTEM</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="125" class="title">Awesome Relational Databases</text>
  <text x="60" y="172" class="title">&amp; PostgreSQL Extensions 🐘⚡</text>

  <!-- Subtitle -->
  <text x="60" y="214" class="subtitle">Curated directory of high-performance managed Cloud DBs, serverless Postgres, and core extensions.</text>
  <text x="60" y="238" class="subtitle">Vector embeddings (pgvector), time-series, geospatial (PostGIS), durable workflows &amp; HA clusters.</text>

  <!-- Interactive Floating Tags / Pills (Dynamic Animated Floating Layer in safe lower area) -->
  <g class="floating-cards" transform="translate(60, 275)">
    <!-- Pill 1: Postgres -->
    <g transform="translate(0, 0)">
      <rect width="130" height="38" class="pill" fill="url(#cardGrad1)" stroke="#336791" />
      <text x="65" y="24" text-anchor="middle" class="badge-text">🐘 PostgreSQL</text>
    </g>

    <!-- Pill 2: pgvector -->
    <g transform="translate(142, 0)">
      <rect width="120" height="38" class="pill" fill="url(#cardGrad1)" stroke="#38bdf8" />
      <text x="60" y="24" text-anchor="middle" class="badge-text">📐 pgvector</text>
    </g>

    <!-- Pill 3: PostGIS -->
    <g transform="translate(274, 0)">
      <rect width="115" height="38" class="pill" fill="url(#cardGrad1)" stroke="#00f2fe" />
      <text x="57" y="24" text-anchor="middle" class="badge-text">🌍 PostGIS</text>
    </g>

    <!-- Pill 4: TimescaleDB -->
    <g transform="translate(401, 0)">
      <rect width="140" height="38" class="pill" fill="url(#cardGrad1)" stroke="#f59e0b" />
      <text x="70" y="24" text-anchor="middle" class="badge-text">⏱️ TimescaleDB</text>
    </g>

    <!-- Pill 5: Citus Distributed -->
    <g transform="translate(553, 0)">
      <rect width="145" height="38" class="pill" fill="url(#cardGrad1)" stroke="#10b981" />
      <text x="72" y="24" text-anchor="middle" class="badge-text">🌐 Citus Distributed</text>
    </g>

    <!-- Pill 6: pg_durable Workflows -->
    <g transform="translate(710, 0)">
      <rect width="150" height="38" class="pill" fill="url(#cardGrad1)" stroke="#8b5cf6" />
      <text x="75" y="24" text-anchor="middle" class="badge-text">⚡ pg_durable</text>
    </g>

    <!-- Pill 7: Cloud Native HA -->
    <g transform="translate(872, 0)">
      <rect width="145" height="38" class="pill" fill="url(#cardGrad1)" stroke="#ec4899" />
      <text x="72" y="24" text-anchor="middle" class="badge-text">🛡️ Patroni &amp; HA</text>
    </g>
  </g>

  <!-- Accent Border highlight on card bottom -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#titleGrad)" stroke-width="2" opacity="0.6" />
</svg>
